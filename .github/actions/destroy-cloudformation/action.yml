name: 'Destroy CloudFormation Resources'
description: 'Destroys resources deployed with AWS CloudFormation'

inputs:
  environment:
    description: 'Environment to destroy (dev/prod)'
    required: true
  repository:
    description: 'GitHub repository name'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Empty S3 buckets before stack deletion
      shell: bash
      run: |
        REPO_NAME=${GITHUB_REPOSITORY#*/}
        STACK_NAME=$REPO_NAME-${{ inputs.environment }}

        empty_bucket() {
          local bucket="$1"
          [ -z "$bucket" ] && return 0

          if ! aws s3api head-bucket --bucket "$bucket" 2>/dev/null; then
            echo "Bucket $bucket not found or not accessible — skipping."
            return 0
          fi

          echo "Emptying bucket: $bucket"

          aws s3 rm "s3://${bucket}" --recursive

          local versions
          versions=$(aws s3api list-object-versions --bucket "$bucket" \
            --query '{Objects: Versions[].{Key: Key, VersionId: VersionId} || []}' \
            --output json)
          local version_count
          version_count=$(echo "$versions" | jq '.Objects | length')
          if [ "$version_count" -gt 0 ]; then
            aws s3api delete-objects --bucket "$bucket" --delete "$versions"
          fi

          local markers
          markers=$(aws s3api list-object-versions --bucket "$bucket" \
            --query '{Objects: DeleteMarkers[].{Key: Key, VersionId: VersionId} || []}' \
            --output json)
          local marker_count
          marker_count=$(echo "$markers" | jq '.Objects | length')
          if [ "$marker_count" -gt 0 ]; then
            aws s3api delete-objects --bucket "$bucket" --delete "$markers"
          fi

          echo "Bucket $bucket emptied successfully."
        }

        WEBSITE_BUCKET=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
          --query "Stacks[0].Outputs[?OutputKey=='WebsiteBucketName'].OutputValue" \
          --output text 2>/dev/null || echo "")
        CLOUDFRONT_LOGS_BUCKET=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
          --query "Stacks[0].Outputs[?OutputKey=='CloudFrontLogsBucketName'].OutputValue" \
          --output text 2>/dev/null || echo "")
        TEMPLATE_BUCKET=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
          --query "Stacks[0].Parameters[?ParameterKey=='TemplateBucket'].ParameterValue" \
          --output text 2>/dev/null || echo "")

        empty_bucket "$WEBSITE_BUCKET"
        empty_bucket "$CLOUDFRONT_LOGS_BUCKET"
        empty_bucket "$TEMPLATE_BUCKET"

    - name: Delete CloudFormation Stack
      shell: bash
      run: |
        REPO_NAME=${GITHUB_REPOSITORY#*/}
        STACK_NAME=$REPO_NAME-${{ inputs.environment }}

        if [ ! -f infrastructure/cloudformation/main-template.yaml ]; then
          echo "main-template.yaml not found — cannot delete stack."
          exit 1
        fi

        echo "Deleting stack: $STACK_NAME"
        aws cloudformation delete-stack --stack-name $STACK_NAME
        echo "Initiated deletion of stack $STACK_NAME"
        aws cloudformation wait stack-delete-complete --stack-name $STACK_NAME
        echo "Stack $STACK_NAME deleted successfully"